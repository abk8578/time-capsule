name: Trigger Time Capsule Unlock Cron

on:
  # NOTE: Schedule is disabled during development so GitHub doesn't fail every 15 mins.
  # Enable this only after deploying live and adding APP_URL & CRON_SECRET to GitHub Secrets.
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call Unlock Cron Endpoint
        run: |
          if [ -z "${{ secrets.APP_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "⚠️ APP_URL or CRON_SECRET is not set in repository secrets. Skipping cron execution."
            exit 0
          fi

          BASE_URL="${{ secrets.APP_URL }}"
          BASE_URL="${BASE_URL%/}"

          echo "Triggering ${BASE_URL}/api/cron/unlock..."
          HTTP_RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "${BASE_URL}/api/cron/unlock" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          echo "Response code: ${HTTP_RESPONSE}"
          cat response.json
          echo ""

          if [ "$HTTP_RESPONSE" -ne 200 ]; then
            echo "❌ Cron failed with HTTP status ${HTTP_RESPONSE}"
            exit 1
          fi

          echo "✅ Time capsule unlock cron executed successfully!"

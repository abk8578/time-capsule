<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Capsule Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Radial Glow behind Capsule -->
  <circle cx="32" cy="32" r="22" fill="url(#centerGlow)"/>

  <!-- Orbital Ring (Cosmic Spacetime) -->
  <ellipse cx="32" cy="32" rx="20" ry="7" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" transform="rotate(-25 32 32)"/>

  <!-- Time Capsule Body: Upper Dome -->
  <path d="M24 25 C24 17 40 17 40 25 L40 28 L24 28 Z" fill="url(#goldGrad)"/>

  <!-- Specular Lid Highlight -->
  <ellipse cx="32" cy="21" rx="4.5" ry="1.5" fill="#FFFFFF" opacity="0.6"/>

  <!-- Central Cryptographic Seal Belt -->
  <rect x="22" y="28" width="20" height="8" rx="2" fill="#030712" stroke="#FBBF24" stroke-width="1.5"/>

  <!-- Mini Lock in Belt -->
  <rect x="30" y="32" width="4" height="3" rx="0.8" fill="#FDE68A"/>
  <path d="M30.8 32 V30.8 C30.8 30.1 31.3 29.6 32 29.6 C32.7 29.6 33.2 30.1 33.2 30.8 V32" stroke="#FDE68A" stroke-width="0.8" fill="none"/>

  <!-- Time Capsule Body: Lower Cylinder -->
  <path d="M24 36 L24 40 C24 47 40 47 40 40 L40 36 Z" fill="url(#goldGrad)"/>

  <!-- Celestial Starburst Sparkle (Top-Right) -->
  <path d="M46 12 Q46 16 50 16 Q46 16 46 20 Q46 16 42 16 Q46 16 46 12 Z" fill="#FDE68A"/>
  <circle cx="46" cy="16" r="1" fill="#FFFFFF"/>

  <!-- Small Accent Star (Bottom-Left) -->
  <path d="M16 44 Q16 46 18 46 Q16 46 16 48 Q16 46 14 46 Q16 46 16 44 Z" fill="#FBBF24" opacity="0.85"/>
</svg>
